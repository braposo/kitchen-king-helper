<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retreat · Kitchen King</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2f5d3a">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .meal { border-top: 1px solid var(--line); padding: 12px 0; }
    .meal-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .meal-head .slot { font-weight: 700; text-transform: capitalize; flex: 1; }
    .meal-head input { width: 8.5rem; }
    .people { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
    .people input { width: 5rem; }
    .dish { margin: 8px 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
    .versions { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 6px; }
    .versions label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
    .versions input { width: 5rem; }
    .linklike { background: none; border: 0; color: var(--accent); padding: 0 4px; min-height: 0; text-decoration: underline; font-weight: 400; }
    details { margin: 6px 0; }
    summary { cursor: pointer; padding: 8px 0; color: var(--accent); font-weight: 600; }
    .picker-list { list-style: none; padding: 0; max-height: 40vh; overflow-y: auto; }
    .picker-list li { padding: 0; }
    .picker-list button { width: 100%; text-align: left; background: transparent; color: var(--fg); border-bottom: 1px solid var(--line); border-radius: 0; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Kitchen King</a></h1>
    <nav><a href="/retreats.html">Retreats</a><a href="/recipes.html">Recipes</a></nav>
  </header>
  <main>
    <div id="app"><p class="muted">Loading…</p></div>
  </main>
  <script type="module" src="/retreat.js"></script>
</body>
</html>
