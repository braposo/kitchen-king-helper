<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order lists · Kitchen King</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .order-line { align-items: flex-start; padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .order-line > .tick { margin-top: 0.0625rem; }
    .line-body { flex: 1; min-width: 0; }
    .line-body summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 0.125rem; border-radius: calc(var(--radius) - 4px); min-height: 1.75rem; }
    .line-body summary::-webkit-details-marker { display: none; }
    .line-body summary:focus-visible { box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
    .line-main { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
    .name { font-weight: 500; line-height: 1.35; }
    .amount { font-weight: 500; white-space: nowrap; }
    .meta { color: var(--muted-foreground); font-size: 0.8125rem; }
    .order-line.done .name, .order-line.done .amount { text-decoration: line-through; color: var(--muted-foreground); font-weight: 400; }
    .order-line.done .meta { opacity: 0.7; }
    .panel { padding: 0.75rem 0 0.25rem; }
    .panel-title { font-size: 0.75rem; font-weight: 500; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.375rem; }
    .uses { margin-bottom: 1rem; font-size: 0.8125rem; }
    .uses li { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.375rem 0; border-top: 1px solid var(--border); }
    .uses li > span:first-child { color: var(--muted-foreground); }
    .uses li > span:last-child { white-space: nowrap; }
    .panel .actions { margin-top: 1rem; }
    .when { padding: 0.5rem 1.25rem; background: var(--muted); border-block: 1px solid var(--border); font-size: 0.75rem; font-weight: 500; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.06em; }
    .card-flush > .card-header + .order-lines { border-top: 1px solid var(--border); }
    .card-flush > .card-header + .when { border-top: 1px solid var(--border); }
    #tabs { margin-bottom: 1rem; }
    @media (min-width: 640px) { .when { padding-inline: 1.5rem; } }
    @media print {
      body { background: #fff; }
      .card-flush { border: 0; border-radius: 0; box-shadow: none; margin-bottom: 14pt; break-inside: auto; }
      .card-flush > .card-header { padding: 0 0 4pt; }
      .item { padding: 4pt 0; min-height: 0; }
      .order-line { break-inside: avoid; }
      .when { background: none; border: 0; padding: 6pt 0 2pt; color: #000; }
      .order-line details > :not(summary) { display: none !important; }
      .tick { appearance: none !important; -webkit-appearance: none !important; border: 0 !important; background: none !important; box-shadow: none !important; width: auto !important; height: auto !important; min-width: 0; font-size: 14pt; line-height: 1.1; display: inline-block; }
      .tick::before { content: "\2610"; width: auto !important; height: auto !important; transform: none !important; background: none !important; -webkit-mask: none !important; mask: none !important; color: #000; }
      .tick:checked::before { content: "\2611"; }
      .order-line.done .name, .order-line.done .amount { color: #000; }
    }
  </style>
</head>

    </div>
  </header>
  <main class="container">
