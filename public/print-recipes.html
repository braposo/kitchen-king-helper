<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe cards · Kitchen King</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/print.css">
</head>
<body class="no-tabbar">
  <header class="app-header toolbar no-print">
    <div class="app-header-inner">
      <a class="btn btn-ghost btn-icon" id="back" href="/retreats.html" aria-label="Back to the retreat"><span data-icon="arrow-left"></span></a>
      <div class="daypicker">
        <button type="button" class="btn btn-ghost btn-icon btn-sm" id="prev" aria-label="Previous day"><span data-icon="chevron-left"></span></button>
        <span class="date-label" id="date" aria-live="polite">Loading…</span>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" id="next" aria-label="Next day"><span data-icon="chevron-right"></span></button>
      </div>
      <div class="toolbar-actions">
        <button type="button" class="btn btn-outline btn-sm" id="all" hidden>All days</button>
        <button type="button" class="btn btn-sm" id="print"><span data-icon="printer"></span><span class="label-wide">Print</span></button>
      </div>
    </div>
  </header>
  <main class="paper" id="cards">
    <div class="stack-sm"><div class="skeleton skeleton-line" style="width:55%"></div><div class="skeleton skeleton-line" style="width:35%"></div><div class="skeleton skeleton-block"></div></div>
  </main>
  <script type="module" src="/print-recipes.js"></script>
</body>
</html>
